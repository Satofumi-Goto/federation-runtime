name: Engineering Gateway — live acceptance only
# この専用ブランチは稼働中Gateway/APIの署名付き受入試験だけを実行する。
# 配備・サービス作成・削除・環境変数変更・DNS切替は行わない。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/render-deploy.yml
      - scripts/render-deploy/**
permissions:
  contents: read
concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/render-deploy/render-deploy.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/render-deploy/render-deploy.test.mjs
      - name: Verify existing signed engineering APIs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/release/gateway-engineering-live.mjs
