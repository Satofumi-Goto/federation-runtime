name: Firewall Phase-0 distribution QA
on:
  pull_request:
    paths:
      - 'services/firewall-gateway/**'
      - 'FIREWALL_DEPLOYMENT.md'
      - 'scripts/verify-firewall-source-attestation.mjs'
      - 'scripts/tests/firewall-source-attestation.test.mjs'
      - 'config/firewall-gateway-migration.json'
      - '.github/workflows/firewall-phase0-qa.yml'
  push:
    branches: [main]
    paths:
      - 'services/firewall-gateway/**'
      - 'scripts/verify-firewall-source-attestation.mjs'
      - 'scripts/tests/firewall-source-attestation.test.mjs'
      - 'config/firewall-gateway-migration.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Firewall security regression
        run: node --test services/firewall-gateway/test/*.test.mjs
      - name: Immutable 27-file canonical provenance and anti-tampering check
        run: |
          node scripts/verify-firewall-source-attestation.mjs
          node --test scripts/tests/firewall-source-attestation.test.mjs
      - name: Source syntax check
        run: |
          node --check services/firewall-gateway/server.mjs
          node --check services/firewall-gateway/access.mjs
          node --check services/firewall-gateway/auth.mjs
          node --check services/firewall-gateway/egress.mjs
          node --check services/firewall-gateway/assistant.mjs
